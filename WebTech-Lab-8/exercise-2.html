<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            margin: 40px;
            line-height: 1.6;
        }
        h3 {
            font-size: 24px;
            margin-bottom: 30px;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
        }
        #output {
            font-size: 18px;
            font-weight: bold;
            background: #f9f9f9;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-top: 20px;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <h3>Student Details</h3>
    <p id="output"></p>

    <script>
        // NEW CHANGED DETAILS
        const student = {
            id: 318,
            name: "KOTNALA MEGHANA",
            department: "CSE",
            marks: 95
        };

        // Object destructuring (ES6 feature)
        const {id, name, department, marks} = student;
        
        // Spread operator to create updated object (ES6 feature)
        const updatedStudent = {
            ...student,
            grade: "A+"
        };

        // Display Expected Output format
        document.getElementById("output").innerHTML = 
            `318 KOTNALA MEGHANA CSE 95

${JSON.stringify(updatedStudent, null, 2)}`;
    </script>
</body>
</html>
