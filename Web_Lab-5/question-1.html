<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System | XML DOM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #3b82f6;
            --primary-glow: rgba(59, 130, 246, 0.2);
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, #1e1b4b 0, transparent 50%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center; justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 95vw; height: 90vh;
            background: var(--surface);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex; flex-direction: column;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header { margin-bottom: 25px; border-left: 4px solid var(--primary); padding-left: 15px; }
        .header h1 { font-size: 1.5rem; font-weight: 700; }
        .header p { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }

        /* Control Panel */
        .control-panel {
            display: flex; gap: 12px;
            background: rgba(15, 23, 42, 0.5);
            padding: 20px; border-radius: 12px;
            margin-bottom: 30px; align-items: flex-end;
            border: 1px solid var(--border);
        }

        .input-group { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 0.65rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }

        input {
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 10px 14px; border-radius: 8px;
            color: white; font-size: 0.85rem; outline: none;
            transition: all 0.2s ease;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        .btn {
            padding: 10px 20px; border-radius: 8px; border: none;
            font-size: 0.75rem; font-weight: 600; cursor: pointer;
            text-transform: uppercase; transition: 0.2s;
        }
        .btn-save { background: var(--primary); color: white; }
        .btn-edit { background: transparent; border: 1px solid var(--primary); color: var(--primary); }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }

        /* Grid View */
        .data-grid {
            flex: 1; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px; overflow-y: auto; padding-right: 8px;
        }
        .data-grid::-webkit-scrollbar { width: 6px; }
        .data-grid::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .emp-card {
            background: #0f172a;
            border-radius: 12px; padding: 20px;
            border: 1px solid var(--border);
            display: flex; flex-direction: column;
            justify-content: space-between;
            transition: 0.2s; height: 160px;
        }
        .emp-card:hover { border-color: var(--primary); background: #131c2e; }

        .meta-id { font-size: 0.6rem; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
        .meta-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 2px; color: #fff; }
        .meta-dept { font-size: 0.75rem; color: var(--text-muted); }

        .meta-salary { 
            font-size: 1.25rem; font-weight: 700; color: #fff;
            padding-top: 12px; margin-top: 12px; border-top: 1px solid var(--border);
        }
        .meta-salary span { color: var(--primary); margin-right: 4px; }

        .card-actions { display: flex; gap: 12px; margin-top: 12px; }
        .action-btn { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); cursor: pointer; text-transform: uppercase; }
        .action-btn:hover { color: var(--primary); }

        #status-bar {
            position: fixed; bottom: 20px; right: 20px;
            padding: 10px 20px; background: var(--primary);
            color: white; border-radius: 8px; font-size: 0.75rem;
            font-weight: 600; display: none; box-shadow: 0 10px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body onload="init()">

<div class="container">
    <div class="header">
        <h1>Employee Management Console</h1>
        <p>XML Document Object Model Registry</p>
    </div>

    <div class="control-panel">
        <div class="input-group"><label>Employee ID</label><input type="text" id="id" placeholder="101"></div>
        <div class="input-group"><label>Full Name</label><input type="text" id="name" placeholder="John Doe"></div>
        <div class="input-group"><label>Division</label><input type="text" id="dept" placeholder="Engineering"></div>
        <div class="input-group"><label>Salary (Monthly)</label><input type="number" id="sal" placeholder="₹"></div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-save" onclick="create()">Add Record</button>
            <button class="btn btn-edit" onclick="update()">Update</button>
        </div>
    </div>

    <div class="data-grid" id="grid"></div>
</div>

<div id="status-bar"></div>

<script>
    let xmlDoc = null;
    const initialData = `<employees>
        <employee><id>101</id><name>Aditya Verma</name><dept>Operations</dept><salary>95000</salary></employee>
        <employee><id>102</id><name>Isha Sharma</name><dept>Technology</dept><salary>115000</salary></employee>
    </employees>`;

    function init() {
        xmlDoc = new DOMParser().parseFromString(initialData, "text/xml");
        render();
    }

    function render() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        const employees = xmlDoc.getElementsByTagName("employee");

        for (let i = 0; i < employees.length; i++) {
            let id = employees[i].getElementsByTagName("id")[0].textContent;
            let name = employees[i].getElementsByTagName("name")[0].textContent;
            let dept = employees[i].getElementsByTagName("dept")[0].textContent;
            let sal = employees[i].getElementsByTagName("salary")[0].textContent;

            grid.innerHTML += `
                <div class="emp-card">
                    <div>
                        <div class="meta-id">SYSTEM ID: ${id}</div>
                        <div class="meta-name">${name}</div>
                        <div class="meta-dept">${dept}</div>
                    </div>
                    <div>
                        <div class="meta-salary"><span>₹</span>${Number(sal).toLocaleString('en-IN')}</div>
                        <div class="card-actions">
                            <span class="action-btn" onclick="load('${id}','${name}','${dept}','${sal}')">Edit</span>
                            <span class="action-btn" style="color:var(--danger)" onclick="remove('${id}')">Delete</span>
                        </div>
                    </div>
                </div>`;
        }
    }

    function create() {
        const id = v('id'), nm = v('name'), dp = v('dept'), sl = v('sal');
        if(!id || !nm) return notify("Validation Error: Name and ID required");

        let node = xmlDoc.createElement("employee");
        ["id", "name", "dept", "salary"].forEach((tag, i) => {
            let el = xmlDoc.createElement(tag);
            el.textContent = [id, nm, dp, sl][i];
            node.appendChild(el);
        });

        xmlDoc.documentElement.appendChild(node);
        render(); clear(); notify("New Record Synchronized");
    }

    function update() {
        const target = v('id');
        const items = xmlDoc.getElementsByTagName("employee");
        for (let e of items) {
            if (e.getElementsByTagName("id")[0].textContent == target) {
                e.getElementsByTagName("dept")[0].textContent = v('dept');
                e.getElementsByTagName("salary")[0].textContent = v('sal');
                render(); clear(); notify("Record Updated Successfully"); return;
            }
        }
        notify("Error: ID not found in registry");
    }

    function remove(id) {
        const items = xmlDoc.getElementsByTagName("employee");
        for (let e of items) {
            if (e.getElementsByTagName("id")[0].textContent == id) {
                e.parentNode.removeChild(e);
                render(); notify("Record Expunged"); return;
            }
        }
    }

    function load(id, name, dept, sal) {
        document.getElementById("id").value = id;
        document.getElementById("name").value = name;
        document.getElementById("dept").value = dept;
        document.getElementById("sal").value = sal;
    }

    function v(i) { return document.getElementById(i).value; }

    function clear() {
        ["id", "name", "dept", "sal"].forEach(f => document.getElementById(f).value = "");
        document.getElementById("id").focus();
    }

    function notify(m) {
        const s = document.getElementById("status-bar");
        s.innerText = m; s.style.display = "block";
        setTimeout(() => s.style.display = "none", 2500);
    }
</script>
</body>
</html>
