<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management System | XML DOM Submission</title>
    <style>
        /* OFFICIAL ENTERPRISE THEME */
        :root {
            --primary-color: #2563eb;
            --secondary-color: #64748b;
            --success-color: #16a34a;
            --danger-color: #dc2626;
            --bg-color: #f1f5f9;
            --table-head: #e2e8f0;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg-color); color: #1e293b; padding: 50px; }
        .wrapper { max-width: 1100px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

        header { border-bottom: 2px solid var(--primary-color); margin-bottom: 30px; padding-bottom: 15px; }
        header h1 { font-size: 22px; margin: 0; color: var(--primary-color); text-transform: uppercase; letter-spacing: 1px; }

        /* INPUT SECTION (VALIDATION READY) */
        .management-panel { 
            display: grid; grid-template-columns: repeat(4, 1fr) auto; 
            gap: 15px; background: var(--bg-color); padding: 25px; 
            border-radius: 8px; margin-bottom: 35px; align-items: flex-end;
        }
        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-size: 11px; font-weight: 700; color: var(--secondary-color); text-transform: uppercase; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; outline: none; }
        input:focus { border-color: var(--primary-color); }

        .btn-submit { background: var(--primary-color); color: white; border: none; padding: 11px 25px; border-radius: 5px; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background: #1d4ed8; }

        /* DATA TABLE SECTION */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: var(--table-head); text-align: left; padding: 15px; font-size: 12px; font-weight: 700; color: #475569; }
        td { padding: 15px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }

        .status-pill { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; display: inline-block; }
        .status-available { background: #dcfce7; color: var(--success-color); }
        .status-borrowed { background: #fee2e2; color: var(--danger-color); }

        .action-link { font-size: 12px; font-weight: 700; color: var(--primary-color); cursor: pointer; text-decoration: none; margin-right: 15px; }
        .action-link:hover { text-decoration: underline; }
        .action-delete { color: var(--danger-color); }

        #toast { position: fixed; top: 20px; right: 20px; background: #334155; color: #fff; padding: 15px 25px; border-radius: 5px; display: none; font-size: 13px; z-index: 1000; }
    </style>
</head>
<body onload="loadBooksAJAX()">

<div class="wrapper">
    <header>
        <h1>Library Information System</h1>
    </header>

    <div class="management-panel">
        <div class="input-box">
            <label>Reference ID</label>
            <input type="text" id="bookId" placeholder="e.g. B101">
        </div>
        <div class="input-box">
            <label>Book Title</label>
            <input type="text" id="title" placeholder="Data Structures">
        </div>
        <div class="input-box">
            <label>Author Name</label>
            <input type="text" id="author" placeholder="Seymour Lipschutz">
        </div>
        <div class="input-box">
            <label>Initial Status</label>
            <select id="status">
                <option value="Available">Available</option>
                <option value="Borrowed">Borrowed</option>
            </select>
        </div>
        <button class="btn-submit" onclick="addBookNode()">Register &lt;book&gt;</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Book ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Availability</th>
                <th>XML DOM Operations</th>
            </tr>
        </thead>
        <tbody id="bookData"></tbody>
    </table>
</div>

<div id="toast"></div>

<script>
    let xmlStore = null;

    /** * Requirement: Use AJAX GET request to load XML data 
     */
    function loadBooksAJAX() {
        const xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
            if (this.readyState == 4 && this.status == 200) {
                xmlStore = this.responseXML;
                renderListView();
            } else if (this.readyState == 4) {
                // Technical Fallback: Simulated XML structure if file missing
                const xmlTemplate = `<library><book><id>1001</id><title>Digital Logic</title><author>M. Mano</author><status>Available</status></book></library>`;
                xmlStore = new DOMParser().parseFromString(xmlTemplate, "text/xml");
                renderListView();
            }
        };
        xhr.open("GET", "books.xml", true);
        xhr.send();
    }

    /** * Requirement: Dynamically refresh book list without page reload 
     */
    function renderListView() {
        const tbody = document.getElementById("bookData");
        tbody.innerHTML = "";
        const books = xmlStore.getElementsByTagName("book");

        for (let i = 0; i < books.length; i++) {
            const id = books[i].getElementsByTagName("id")[0].textContent;
            const title = books[i].getElementsByTagName("title")[0].textContent;
            const author = books[i].getElementsByTagName("author")[0].textContent;
            const status = books[i].getElementsByTagName("status")[0].textContent;

            const row = `<tr>
                <td><b>${id}</b></td>
                <td>${title}</td>
                <td>${author}</td>
                <td><span class="status-pill status-${status.toLowerCase()}">${status}</span></td>
                <td>
                    <span class="action-link" onclick="updateStatusNode('${id}')">Update Status</span>
                    <span class="action-link action-delete" onclick="deleteBookNode('${id}')">Delete</span>
                </td>
            </tr>`;
            tbody.innerHTML += row;
        }
    }

    /** * Requirement: Add new <book> node using XML DOM methods 
     */
    function addBookNode() {
        const id = getV("bookId"), ti = getV("title"), au = getV("author"), st = getV("status");

        // Requirement: Implement validation before performing operations
        if(!id || !ti || !au) return showMsg("Validation Error: Please fill all fields.");

        let newBook = xmlStore.createElement("book");
        
        let idNode = xmlStore.createElement("id"); idNode.textContent = id;
        let titleNode = xmlStore.createElement("title"); titleNode.textContent = ti;
        let authorNode = xmlStore.createElement("author"); authorNode.textContent = au;
        let statusNode = xmlStore.createElement("status"); statusNode.textContent = st;

        newBook.appendChild(idNode);
        newBook.appendChild(titleNode);
        newBook.appendChild(authorNode);
        newBook.appendChild(statusNode);

        xmlStore.documentElement.appendChild(newBook);
        
        // Requirement: Data consistency - immediate UI refresh
        renderListView();
        clearInputs();
        showMsg("New book entry added to XML DOM.");
    }

    /** * Requirement: Update availability status using XML DOM methods 
     */
    function updateStatusNode(targetId) {
        const books = xmlStore.getElementsByTagName("book");
        for (let i = 0; i < books.length; i++) {
            if (books[i].getElementsByTagName("id")[0].textContent == targetId) {
                let statusEl = books[i].getElementsByTagName("status")[0];
                statusEl.textContent = (statusEl.textContent === "Available") ? "Borrowed" : "Available";
                renderListView();
                showMsg("Book availability patched.");
                return;
            }
        }
    }

    /** * Requirement: Delete a book entry using XML DOM methods 
     */
    function deleteBookNode(targetId) {
        const books = xmlStore.getElementsByTagName("book");
        for (let i = 0; i < books.length; i++) {
            if (books[i].getElementsByTagName("id")[0].textContent == targetId) {
                // Requirement: Data consistency after each operation
                books[i].parentNode.removeChild(books[i]);
                renderListView();
                showMsg("Entry expunged from XML structure.");
                return;
            }
        }
    }

    // Helper Functions
    function getV(id) { return document.getElementById(id).value.trim(); }
    function clearInputs() { 
        ["bookId", "title", "author"].forEach(el => document.getElementById(el).value = "");
        document.getElementById("bookId").focus();
    }
    function showMsg(m) {
        const t = document.getElementById("toast");
        t.innerText = m; t.style.display = "block";
        setTimeout(() => t.style.display="none", 3000);
    }
</script>
</body>
</html>
