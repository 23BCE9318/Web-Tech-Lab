<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Records | JSON Fetch System</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg: #f8fafc;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 1.5rem; line-height: 1.6; }
        
        .container { max-width: 1100px; margin: 0 auto; width: 100%; }

        header { margin-bottom: 2rem; border-bottom: 3px solid var(--primary); display: inline-block; padding-bottom: 0.5rem; }
        header h1 { font-size: 1.75rem; color: var(--primary); text-transform: uppercase; }

        /* Responsive Form Panel (Create & Update) */
        .form-panel {
            background: white; padding: 2rem; border-radius: 10px;
            border: 1px solid var(--border); margin-bottom: 2rem;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem; align-items: flex-end;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .input-group label { font-size: 0.85rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        
        input {
            padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px;
            font-size: 1rem; transition: 0.2s;
        }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }

        .btn {
            background: var(--primary); color: white; padding: 0.8rem;
            border: none; border-radius: 6px; font-weight: 700;
            cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        .btn:hover { background: var(--primary-dark); }

        /* Table View (Read) */
        .table-responsive {
            background: white; border-radius: 10px; border: 1px solid var(--border);
            overflow-x: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { background: #f1f5f9; text-align: left; padding: 1rem; font-size: 0.8rem; color: #475569; border-bottom: 2px solid var(--border); }
        td { padding: 1rem; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        
        .marks-badge { background: #dcfce7; color: #166534; padding: 0.2rem 0.6rem; border-radius: 4px; font-weight: 700; }
        
        .action-btn { color: var(--primary); cursor: pointer; font-weight: 700; margin-right: 1rem; font-size: 0.85rem; }
        .action-btn.delete { color: #dc2626; }
        .action-btn:hover { text-decoration: underline; }

        #alert {
            position: fixed; bottom: 20px; right: 20px; padding: 1rem 2rem;
            background: #1e293b; color: white; border-radius: 8px; display: none; z-index: 100;
        }
    </style>
</head>
<body onload="initFetch()">

<div class="container">
    <header><h1>Student Information Dashboard</h1></header>

    <div class="form-panel">
        <div class="input-group">
            <label>Student ID</label>
            <input type="text" id="id" placeholder="Ex: S101">
        </div>
        <div class="input-group">
            <label>Name</label>
            <input type="text" id="name" placeholder="Ex: John Doe">
        </div>
        <div class="input-group">
            <label>Course</label>
            <input type="text" id="course" placeholder="Ex: Computer Science">
        </div>
        <div class="input-group">
            <label>Marks</label>
            <input type="number" id="marks" placeholder="0-100">
        </div>
        <button class="btn" id="mainBtn" onclick="createRecord()">Register Student</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student Name</th>
                    <th>Course</th>
                    <th>Marks</th>
                    <th>Operations</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>
</div>

<div id="alert"></div>

<script>
    let studentStore = [];

    /**
     * REQUIREMENT: Use Fetch API and Parse using response.json()
     * REQUIREMENT: Handle JSON parsing errors
     */
    async function initFetch() {
        try {
            const response = await fetch('students.json');
            if (!response.ok) throw new Error("Local JSON file not found.");
            
            studentStore = await response.json();
            render();
            msg("JSON Data Synchronized");
        } catch (err) {
            console.error("Fetch Error:", err.message);
            // Default fallback for demonstration
            studentStore = [
                { id: "S101", name: "Alice Johnson", course: "Software Engineering", marks: 92 },
                { id: "S102", name: "Bob Smith", course: "Data Science", marks: 85 }
            ];
            render();
            msg("Using Memory Buffer (JSON file missing)");
        }
    }

    /**
     * REQUIREMENT: Display students in table (Read)
     */
    function render() {
        const tbody = document.getElementById("dataTable");
        tbody.innerHTML = "";
        studentStore.forEach(s => {
            tbody.innerHTML += `
                <tr>
                    <td><b>${s.id}</b></td>
                    <td>${s.name}</td>
                    <td>${s.course}</td>
                    <td><span class="marks-badge">${s.marks}%</span></td>
                    <td>
                        <span class="action-btn" onclick="prepareUpdate('${s.id}')">Modify</span>
                        <span class="action-btn delete" onclick="deleteRecord('${s.id}')">Remove</span>
                    </td>
                </tr>`;
        });
    }

    /**
     * REQUIREMENT: Add new student object (Create)
     * REQUIREMENT: Validate input fields before submission
     */
    function createRecord() {
        const id = v('id'), nm = v('name'), cs = v('course'), mk = v('marks');

        if(!id || !nm || !cs || !mk) return msg("Validation Failed: Empty Fields!");
        if(studentStore.find(s => s.id === id)) return msg("Error: ID already exists!");

        studentStore.push({ id, name: nm, course: cs, marks: parseInt(mk) });
        updateUI("Record Created Successfully");
    }

    /**
     * REQUIREMENT: Modify marks or course (Update)
     */
    function prepareUpdate(id) {
        const s = studentStore.find(x => x.id === id);
        document.getElementById('id').value = s.id;
        document.getElementById('id').disabled = true;
        document.getElementById('name').value = s.name;
        document.getElementById('course').value = s.course;
        document.getElementById('marks').value = s.marks;

        const btn = document.getElementById('mainBtn');
        btn.innerText = "Commit Update";
        btn.onclick = () => finalizeUpdate(id);
        window.scrollTo(0,0);
    }

    function finalizeUpdate(id) {
        const i = studentStore.findIndex(x => x.id === id);
        studentStore[i].course = v('course');
        studentStore[i].marks = parseInt(v('marks'));

        resetForm();
        updateUI("Record Updated");
    }

    /**
     * REQUIREMENT: Remove student object (Delete)
     */
    function deleteRecord(id) {
        studentStore = studentStore.filter(s => s.id !== id);
        updateUI("Record Expunged");
    }

    /**
     * REQUIREMENT: Update UI dynamically without page refresh
     */
    function updateUI(message) {
        render();
        resetForm();
        msg(message);
    }

    function v(i) { return document.getElementById(i).value.trim(); }
    
    function resetForm() {
        ["id", "name", "course", "marks"].forEach(f => document.getElementById(f).value = "");
        const btn = document.getElementById('mainBtn');
        btn.innerText = "Register Student";
        btn.onclick = createRecord;
        document.getElementById('id').disabled = false;
    }

    function msg(m) {
        const a = document.getElementById("alert");
        a.innerText = m; a.style.display = "block";
        setTimeout(() => a.style.display = "none", 2500);
    }
</script>
</body>
</html>
