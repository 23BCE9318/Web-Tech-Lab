<!DOCTYPE html>
<html>

<head>
<title>Student Notes Manager</title>

<style>

body{
font-family: "Segoe UI", sans-serif;
background: linear-gradient(135deg,#667eea,#764ba2);
margin:0;
}

header{
text-align:center;
color:white;
padding:25px;
font-size:32px;
font-weight:bold;
}

.container{
width:80%;
margin:auto;
margin-top:20px;
display:grid;
grid-template-columns: 1fr 1fr;
gap:25px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

h3{
margin-top:0;
color:#333;
}

label{
font-weight:600;
}

input{
width:100%;
padding:12px;
margin-top:6px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:6px;
font-size:14px;
}

button{
padding:12px 18px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
font-size:14px;
}

.addBtn{
background:#6366f1;
color:white;
}

.addBtn:hover{
background:#4f46e5;
}

.viewBtn{
background:#22c55e;
color:white;
margin-left:10px;
}

.viewBtn:hover{
background:#16a34a;
}

.deleteBtn{
background:#ef4444;
color:white;
margin-top:10px;
}

.note{
background:#f9fafb;
padding:15px;
margin-top:15px;
border-radius:8px;
border-left:6px solid #6366f1;
}

.note h4{
margin:0;
color:#333;
}

.note p{
margin:5px 0;
color:#555;
}

</style>

</head>

<body>

<header>
📚 Student Notes Manager
</header>

<div class="container">

<div class="card">

<h3>Add New Note</h3>

<label>Title</label>
<input id="title" placeholder="Enter note title">

<label>Subject</label>
<input id="subject" placeholder="Enter subject">

<label>Description</label>
<input id="description" placeholder="Enter description">

<button class="addBtn" onclick="addNote()">Add Note</button>
<button class="viewBtn" onclick="viewNotes()">View Notes</button>

</div>

<div class="card">

<h3>Stored Notes</h3>

<div id="notes"></div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
