<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Mono | Shopping Experience</title>
<style>
    :root {
        --blue-dark: #0047b3;
        --blue-light: #cce0ff;
        --white: #ffffff;
        --gray-dark: #666666;
    }

    body {
        font-family: 'Inter', -apple-system, sans-serif;
        background-color: var(--blue-light);
        color: var(--blue-dark);
        margin: 0;
        display: flex;
        justify-content: center;
        gap: 80px;
        padding: 50px 20px;
        flex-wrap: wrap;
    }

    .container {
        width: 100%;
        max-width: 440px;
    }

    h2 {
        font-weight: 900;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid var(--blue-dark);
        color: var(--blue-dark);
    }

    .product-card {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 20px;
        border: 1px solid var(--blue-light);
        margin-bottom: 12px;
        transition: all 0.3s ease;
        background: var(--white);
        border-radius: 8px;
    }

    .product-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        border-color: var(--blue-dark);
    }

    .product-img {
        width: 100px;
        height: 100px;
        background-color: var(--blue-light);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
    }

    .product-details { flex: 1; }
    .product-name { font-weight: 800; font-size: 1rem; text-transform: uppercase; color: var(--blue-dark);}
    .product-price { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

    .btn-add-cart {
        background: var(--blue-dark);
        color: var(--white);
        border: none;
        padding: 10px 18px;
        font-weight: 700;
        font-size: 0.75rem;
        cursor: pointer;
        border-radius: 4px;
    }

    .btn-add-cart:hover {
        background: var(--white);
        color: var(--blue-dark);
        border: 1px solid var(--blue-dark);
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        background: var(--white);
        border-radius: 6px;
        overflow: hidden;
    }

    th, td {
        padding: 10px;
        text-align: center;
        border-bottom: 1px solid var(--blue-dark);
        font-size: 0.9rem;
    }

    th {
        background-color: var(--blue-dark);
        color: var(--white);
    }

    input[type="number"] {
        width: 50px;
        padding: 4px;
        border-radius: 4px;
        border: 1px solid var(--blue-dark);
        text-align: center;
    }

    .promo-section {
        display: flex;
        gap: 5px;
        margin-top: 10px;
    }

    .promo-section input {
        flex: 1;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid var(--blue-dark);
        text-transform: uppercase;
    }

    .promo-section button {
        padding: 8px 12px;
        background: var(--blue-dark);
        color: var(--white);
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .promo-section button:hover {
        background: var(--white);
        color: var(--blue-dark);
        border: 1px solid var(--blue-dark);
    }

    .total-box {
        margin-top: 15px;
        text-align: right;
        font-weight: 900;
        font-size: 1.2rem;
        color: var(--blue-dark);
    }
</style>
</head>
<body>

<div class="container">
    <h2>Products</h2>
    <div id="catalog"></div>
</div>

<div class="container">
    <h2>Your Cart</h2>
    <table id="cartTable">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Remove</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div class="promo-section">
        <input type="text" id="coupon" placeholder="Promo Code (SAVE50)">
        <button onclick="applyCoupon()">Apply</button>
    </div>

    <div class="total-box" id="totalPrice">Total: $0</div>
</div>

<script>
const products = [
    { id: 1, name: "Digital Camera", price: 850, cat: "Electronics", img: "📷" },
    { id: 2, name: "Headphones", price: 299, cat: "Electronics", img: "🎧" },
    { id: 3, name: "Notebook", price: 15, cat: "Office", img: "📓" }
];

let cart = [];
let discountApplied = 0;

// Render products
function initStore() {
    const catalog = document.getElementById('catalog');
    catalog.innerHTML = products.map(p => `
        <div class="product-card">
            <div class="product-img">${p.img}</div>
            <div class="product-details">
                <span class="product-name">${p.name}</span>
                <span class="product-price">$${p.price.toFixed(2)}</span>
            </div>
            <button class="btn-add-cart" onclick="addToCart(${p.id})">Add to Cart</button>
        </div>
    `).join('');
}

function addToCart(id) {
    const item = products.find(p => p.id === id);
    const existing = cart.find(p => p.id === id);
    if(existing) existing.qty++;
    else cart.push({...item, qty: 1});
    renderCart();
}

function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    renderCart();
}

function updateQty(id, qty) {
    const item = cart.find(p => p.id === id);
    item.qty = parseInt(qty) || 1;
    renderCart();
}

function calculateTotal() {
    let total = 0;
    cart.forEach(item => {
        let subtotal = item.price * item.qty;
        if(item.qty >= 5) subtotal *= 0.9;
        if(item.cat === "Electronics" && item.price * item.qty > 500) subtotal *= 0.95;
        total += subtotal;
    });
    total -= discountApplied;
    return total.toFixed(2);
}

function renderCart() {
    const tbody = document.querySelector("#cartTable tbody");
    tbody.innerHTML = cart.map(item => `
        <tr>
            <td>${item.name}</td>
            <td>$${item.price.toFixed(2)}</td>
            <td><input type="number" value="${item.qty}" min="1" onchange="updateQty(${item.id}, this.value)"></td>
            <td>$${(item.price*item.qty).toFixed(2)}</td>
            <td><button onclick="removeFromCart(${item.id})">Remove</button></td>
        </tr>
    `).join('');

    document.getElementById("totalPrice").innerText = "Total: $" + calculateTotal();
}

function applyCoupon() {
    const code = document.getElementById("coupon").value.trim().toUpperCase();
    if(code === "SAVE50") discountApplied = 50;
    else if(code === "SAVE10") discountApplied = 10;
    else {
        alert("Invalid coupon code");
        discountApplied = 0;
    }
    renderCart();
}

initStore();
renderCart();
</script>
</body>
</html>
