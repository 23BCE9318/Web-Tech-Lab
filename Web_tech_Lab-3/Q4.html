<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real-Time User Activity Monitor</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f0f4f8; /* light gray-blue */
    padding: 20px;
}

.container {
    background: #ffffff;
    padding: 22px;
    max-width: 700px;
    margin: auto;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    border-left: 6px solid #2a9d8f; /* teal accent */
}

h2 {
    text-align: center;
    color: #2a9d8f;
}

input {
    padding: 10px;
    width: 100%;
    margin-bottom: 12px;
    border: 1.5px solid #cfd8dc;
    border-radius: 5px;
}

input:focus {
    outline: none;
    border-color: #2a9d8f;
}

.log {
    border: 1.5px solid #cfd8dc;
    height: 200px;
    overflow-y: auto;
    padding: 10px;
    margin-top: 10px;
    background-color: #fafafa;
    border-radius: 5px;
}

.warning {
    color: #e63946; /* soft red */
    font-weight: bold;
    margin-top: 12px;
}

button {
    margin-top: 12px;
    padding: 8px 18px;
    background-color: #2a9d8f;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

button:hover {
    background-color: #21867a;
}
</style>
</head>

<body>

<div class="container">
    <h2>Real-Time User Activity Monitor</h2>

    <input type="text" placeholder="Click, focus, or type here">

    <div class="log" id="log"></div>
    <div class="warning" id="warning"></div>

    <button onclick="resetLog()">Reset Log</button>
    <button onclick="exportLog()">Export Log</button>
</div>

<script>
let activityLog = [];
let clickCount = 0;
const CLICK_LIMIT = 8;

function logActivity(type, target, phase) {
    activityLog.push({
        eventType: type,
        targetElement: target,
        eventPhase: phase,
        time: new Date().toLocaleTimeString()
    });
    displayLog();
}

function displayLog() {
    const logDiv = document.getElementById("log");
    logDiv.innerHTML = "";

    activityLog.forEach((item, index) => {
        logDiv.innerHTML +=
            (index + 1) + ". [" + item.time + "] " +
            item.eventType + " - " +
            item.targetElement + " (" +
            item.eventPhase + ")<br>";
    });
}

document.addEventListener("click", function(e) {
    logActivity("Click", e.target.tagName, "Capturing");
}, true);

document.addEventListener("click", function(e) {
    clickCount++;
    logActivity("Click", e.target.tagName, "Bubbling");

    if (clickCount > CLICK_LIMIT) {
        document.getElementById("warning").textContent =
            "Warning: Too many clicks detected!";
    }
}, false);

document.addEventListener("keydown", function(e) {
    logActivity("Key Press", e.key, "Bubbling");
});

document.addEventListener("focusin", function(e) {
    logActivity("Focus", e.target.tagName, "Bubbling");
});

function resetLog() {
    activityLog = [];
    clickCount = 0;
    document.getElementById("log").innerHTML = "";
    document.getElementById("warning").textContent = "";
}

function exportLog() {
    let text = "User Activity Log\n\n";
    activityLog.forEach(item => {
        text += "[" + item.time + "] " +
                item.eventType + " - " +
                item.targetElement + " (" +
                item.eventPhase + ")\n";
    });
    alert(text);
}
</script>

</body>
</html>
